:root{
  --bg:#001E2B;--bg2:#0B2B38;--bg3:#112F3D;--line:#1C4A3A;--fg:#FDFFF5;--muted:#A4B0AE;--dim:#5C6C75;
  --green:#00ED64;--forest:#00684A;--mid:#00A450;--lime:#B0FF05;--amber:#FFC010;--orange:#FF6F00;
  --v44:#FF6F00;--v50:#FFC010;--v60:#B0FF05;--v70:#00A450;--v80:#00ED64;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'SG',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
a{color:var(--green)}
h1,h2,h3{font-family:'HL','Arial Narrow',sans-serif;font-weight:400;letter-spacing:.2px;margin:0;line-height:1}
h1{font-size:clamp(44px,6vw,84px);color:var(--green);text-transform:uppercase}
h2{font-size:clamp(34px,4vw,52px);text-transform:uppercase;color:var(--green)}
h3{font-size:24px;text-transform:uppercase}
.lead{font-size:19px;color:var(--muted);max-width:900px;margin:10px 0 0}
header{position:sticky;top:0;z-index:20;background:rgba(0,30,43,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.hwrap{display:flex;align-items:center;gap:22px;padding:0 24px;height:58px;max-width:1440px;margin:0 auto}
.brand{font-family:'HL';font-size:21px;color:var(--green);white-space:nowrap;text-transform:uppercase;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:6px;white-space:nowrap;font-size:14.5px;font-weight:700}
nav a span{color:var(--dim);margin-right:6px}
nav a:hover{color:var(--fg);background:var(--bg2)}
nav a.on{color:var(--bg);background:var(--green)}
nav a.on span{color:var(--forest)}
main{max-width:1440px;margin:0 auto;padding:34px 24px 80px}
section{display:none;animation:fade .25s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:1.2px;color:var(--green);text-transform:uppercase;margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:980px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g3,.g4,.g5{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{margin:0 0 6px;font-size:18px;color:var(--green)}
.card p{margin:4px 0;color:var(--fg)}
.card .sm{color:var(--muted);font-size:14px}
.kpi .n{font-family:'HL';font-size:58px;color:var(--green);line-height:1}
.kpi .l{font-weight:700;margin-top:4px}
.kpi .d{color:var(--muted);font-size:14px}
.block{margin-top:34px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid currentColor}
.p-green{color:var(--green)}.p-amber{color:var(--amber)}.p-orange{color:var(--orange)}.p-muted{color:var(--muted)}
.note{border-left:3px solid var(--amber);background:rgba(255,192,16,.07);padding:12px 16px;border-radius:0 8px 8px 0;color:var(--fg);margin-top:16px}
.note.g{border-color:var(--green);background:rgba(0,237,100,.06)}
.q{background:var(--green);color:var(--bg);border-radius:10px;padding:18px 22px;margin-top:22px}
.q b{display:block;font-family:'HL';font-size:22px;text-transform:uppercase;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-family:'HL';font-weight:400;font-size:17px;text-transform:uppercase;color:var(--bg);background:var(--green);padding:8px 10px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.hl td{background:rgba(0,237,100,.07)}
.tw{overflow-x:auto;border-radius:8px}
.src{margin-top:30px;font-size:13px;color:var(--dim)}
.src a{color:var(--muted)}
.vdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.vbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 6px;background:var(--bg3)}
.vbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
/* estate */
.acc{cursor:pointer;transition:border-color .15s}
.acc:hover{border-color:var(--green)}
.acc .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.acc .t b{font-family:'HL';font-size:22px;font-weight:400;text-transform:uppercase}
.acc .meta{color:var(--muted);font-size:13.5px}
.acc.open{grid-column:1/-1;border-color:var(--green)}
.acc .detail{display:none;margin-top:14px}
.acc.open .detail{display:block}
.flag{color:var(--amber);font-weight:700}
/* target */
.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:22px}
.ctl label{display:block;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:transparent;color:var(--fg);border:0;padding:8px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--green);color:var(--bg)}
.ctl input{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:8px 10px;font:inherit;font-size:14px;width:200px}
.counter{margin-left:auto;text-align:right}
.counter .n{font-family:'HL';font-size:34px;color:var(--green);line-height:1}
.counter .l{font-size:12.5px;color:var(--muted)}
.paying{margin-top:20px;background:var(--green);color:var(--bg);border-radius:10px 10px 0 0;padding:10px 16px;font-weight:700;font-size:14px}
.paying span{font-weight:400}
.orgs{display:grid;gap:16px;border:1px solid var(--green);border-top:0;border-radius:0 0 10px 10px;padding:16px}
.orgs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.orgs.many{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
@media(max-width:980px){.orgs.two{grid-template-columns:1fr}}
.org{border:1px dashed #2E6B57;border-radius:10px;padding:12px}
.org>.oh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.org>.oh b{font-family:'HL';font-size:24px;font-weight:400;color:var(--green);text-transform:uppercase}
.org>.oh span{font-size:13px;color:var(--muted)}
.proj{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.proj:last-child{margin-bottom:0}
.proj .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.proj .ph b{font-family:'HL';font-size:19px;font-weight:400;text-transform:uppercase}
.proj .ph span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.proj.missing{border-color:var(--amber)}
.warn{font-size:12.5px;color:var(--amber);font-weight:700;margin:-2px 0 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chip{border-radius:7px;padding:7px 9px;cursor:pointer;border:1.5px solid transparent;background:var(--bg3);transition:transform .1s,opacity .2s;position:relative;min-height:52px}
.chip:hover{transform:translateY(-1px);border-color:var(--fg)}
.chip .cn{font-weight:700;font-size:13px;line-height:1.15;padding-right:44px;word-break:break-word}
.chip .ct{position:absolute;right:8px;top:6px;font-family:'HL';font-size:19px}
.chip .cs{font-size:11.5px;margin-top:3px;display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.chip .cs .vdot{width:8px;height:8px;margin:0}
.chip.shared{background:var(--green);color:var(--bg)}
.chip.shared .cs{color:var(--forest)}
.chip.shared .vdot{box-shadow:0 0 0 1.5px #001E2B}
.chip.ded{background:var(--bg3);color:var(--fg)}
.chip.ded .ct{color:var(--green)}
.chip.v4{background:var(--bg3);border-color:var(--orange)}
.chip.v4 .ct{color:var(--orange)}
.chip.cache{border-color:var(--amber)}
.chip.cache .ct{color:var(--amber)}
.chip.devc{background:#173B48}
.chip.dim{opacity:.18}
.chip.hit{outline:3px solid var(--lime);outline-offset:1px}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:#04212F;border-left:1px solid var(--green);z-index:40;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:24px 26px 40px;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
.drawer.on{transform:none}
.drawer .x{position:absolute;right:16px;top:14px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;font-size:18px;width:34px;height:34px;cursor:pointer}
.drawer h3{color:var(--green);font-size:32px;margin:6px 0 4px;padding-right:40px}
.drawer .sub{color:var(--muted);font-size:14px}
.drawer .sec{margin-top:20px}
.drawer .sec>b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.drawer td{font-size:13.5px}
.scrim{position:fixed;inset:0;background:rgba(0,10,15,.45);z-index:35;display:none}
.scrim.on{display:block}
/* isolation */
.ladder{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap}
.ladder button{flex:1;min-width:120px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:12px;font:inherit;cursor:pointer;text-align:left}
.ladder button small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.ladder button b{font-family:'HL';font-weight:400;font-size:22px;text-transform:uppercase}
.ladder button.on{background:var(--green);color:var(--bg);border-color:var(--green)}
.ladder button.on small{color:var(--forest)}
.strength{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--mid),var(--amber),var(--orange));margin:10px 0 2px}
.strength-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lvl{margin-top:16px}
svg text{font-family:'SG',sans-serif}
.diagram{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px}
/* checklist */
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex:none}
.ck.done span{color:var(--muted);text-decoration:line-through}
.home-cards .card{cursor:pointer;transition:border-color .15s}
.home-cards .card:hover{border-color:var(--green)}
.home-cards .num{font-family:'HL';font-size:40px;color:var(--forest)}
.footnav{display:flex;justify-content:space-between;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
.footnav a{text-decoration:none;font-weight:700}
.hint{color:var(--dim);font-size:12.5px}
@media print{header,.controls,.footnav{position:static}section{display:block!important;page-break-after:always}.drawer,.scrim{display:none}}
</style>
</head>

const perSvc = s => ({ name: s.svc, tier: s.prod ? s.own : (s.ram <= 4 ? 'M20' : 'M30'), dedicated: true, services: [s.svc], perSvc: true });
function chipsFor(p) {

  return ch.flatMap(g => {
    const by = {}; g.services.forEach(n => (by[pr(n)] = by[pr(n)] || []).push(n));

}
function analyticsSvg() {
  const node = (x, y, label, sub, fill, stroke) => `<rect x="${x}" y="${y}" width="150" height="62" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><text x="${x + 75}" y="${y + 27}" text-anchor="middle" font-size="15" font-weight="700" fill="${fill === '#00ED64' ? '#001E2B' : '#FDFFF5'}">${label}</text><text x="${x + 75}" y="${y + 46}" text-anchor="middle" font-size="12" fill="${fill === '#00ED64' ? '#00684A' : '#A4B0AE'}">${sub}</text>`;
  return `<svg viewBox="0 0 600 340" width="100%" role="img" aria-label="Replica set with analytics node">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#00ED64"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#FFC010"/></marker></defs>
    <rect x="20" y="120" width="560" height="200" rx="12" fill="none" stroke="#1C4A3A" stroke-dasharray="5 4"/>
    <text x="36" y="142" font-size="12" fill="#A4B0AE" letter-spacing="1">ONE REPLICA SET · SAME DATA</text>
    ${node(40, 160, 'Primary', 'reads + writes', '#00ED64', '#00ED64')}${node(225, 160, 'Secondary', 'electable', '#0B2B38', '#1C4A3A')}${node(410, 160, 'Analytics node', 'nodeType:ANALYTICS', '#0B2B38', '#FFC010')}
    <path d="M190 191 H225" stroke="#1C4A3A" stroke-width="2"/><path d="M375 191 H410" stroke="#1C4A3A" stroke-width="2"/>
    <text x="300" y="255" text-anchor="middle" font-size="12" fill="#A4B0AE">replication</text><path d="M115 222 V270 H485 V222" fill="none" stroke="#1C4A3A" stroke-width="1.5" stroke-dasharray="4 3"/>
    ${node(40, 20, 'Microservices', 'operational traffic', '#112F3D', '#00ED64')}${node(410, 20, 'Reporting / BI', 'long reads', '#112F3D', '#FFC010')}
    <path d="M115 82 V156" stroke="#00ED64" stroke-width="2" marker-end="url(#ar)"/><path d="M485 82 V156" stroke="#FFC010" stroke-width="2" marker-end="url(#ar2)"/>
  </svg>`;
}

// STORAGE
add('storage', 'Storage', () => {
  const big = prodSvcs.filter(s => s.disk >= 300).sort((a, b) => b.disk - a.disk);
  const idea = s => /aggregator-cache/.test(s.svc) ? 'TTL if it is a true cache, otherwise archive older data' : /payments/.test(s.svc) ? 'Online Archive for transaction history' : /bonus/.test(s.svc) ? 'Online Archive for expired bonuses' : /digitain/.test(s.svc) ? 'Online Archive for settled bets' : /postback|notification/.test(s.svc) ? 'TTL: event and log data' : 'Depends on content: to discuss';
  return `<div class="kicker">05 · Storage</div><h2>TTL indexes and Online Archive</h2>
  <p class="lead">Expire what is cache, archive what is history. Both keep the operational cluster small, which matters most for the two 8 TB caches.</p>
  <div class="diagram block">${lifecycleSvg()}</div>
  <div class="grid g2 block">
    <div class="card"><h4>TTL index · delete what expires</h4><p>MongoDB deletes documents automatically once they are older than a set age, based on a date field.</p><p class="sm">A single-field index on a date field with <code>expireAfterSeconds</code>. A background task removes expired documents every 60 seconds. Compound indexes don't support TTL.</p><p class="sm">Fits: caches, sessions, logs, notifications.</p></div>
    <div class="card"><h4>Online Archive · keep it, cheaper</h4><p>Atlas moves older documents to cloud object storage, on a date-based or custom rule.</p><p class="sm">Archived data stays queryable together with live data. Available on M10+ and in Frankfurt.</p><p class="sm">Fits: payments history, settled bets, expired bonuses.</p></div>
  </div>
  <div class="block"><h3>Candidates to validate</h3><div class="tw" style="margin-top:10px"><table><tr><th>Service</th><th>Project</th><th>Version</th><th>Disk per node</th><th>Idea</th></tr>
  ${big.map(s => `<tr${/aggregator/.test(s.svc) ? ' class="hl"' : ''}><td><b>${s.svc}</b></td><td>${s.proj.name}</td><td><span class="vdot" style="background:${VC[maj(s.ver)]}"></span>${s.ver}</td><td>${disk(s.disk)}</td><td>${idea(s)}</td></tr>`).join('')}</table></div>
  <p class="sm" style="color:var(--muted)">Disk is provisioned, not used. Real data sizes will change this list.</p></div>
  <div class="note">The 8 TB caches are above the 4 TB standard storage per cluster. Extended storage goes higher on large tiers, but the docs call it a temporary solution that slows initial sync. Long term: TTL, archive or shard.</div>
  <div class="q"><b>Question for the room</b>Do the game-aggregator caches need all 8 TB online? What is the access pattern, and how old is the oldest data that is still read?</div>
  ${src('ttl', 'oa', 'storage')}`;
});
function lifecycleSvg() {
  return `<svg viewBox="0 0 1000 230" width="100%" role="img" aria-label="Data lifecycle">
  <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#A4B0AE"/></marker></defs>
  <rect x="20" y="40" width="270" height="110" rx="12" fill="#00ED64"/><text x="155" y="82" text-anchor="middle" font-size="22" font-weight="700" fill="#001E2B">Atlas cluster</text><text x="155" y="108" text-anchor="middle" font-size="14" fill="#00684A">hot data · fast storage</text><text x="155" y="128" text-anchor="middle" font-size="14" fill="#00684A">what the app reads every day</text>
  <path d="M295 95 H395" stroke="#A4B0AE" stroke-width="2" marker-end="url(#a3)"/><text x="345" y="84" text-anchor="middle" font-size="13" fill="#A4B0AE">older than N days</text>
  <rect x="400" y="40" width="270" height="110" rx="12" fill="#0B2B38" stroke="#00ED64"/><text x="535" y="82" text-anchor="middle" font-size="22" font-weight="700" fill="#FDFFF5">Online Archive</text><text x="535" y="108" text-anchor="middle" font-size="14" fill="#A4B0AE">cloud object storage</text><text x="535" y="128" text-anchor="middle" font-size="14" fill="#A4B0AE">still queryable with live data</text>
  <path d="M675 95 H775" stroke="#A4B0AE" stroke-width="2" marker-end="url(#a3)"/><text x="725" y="84" text-anchor="middle" font-size="13" fill="#A4B0AE">past retention</text>
  <rect x="780" y="40" width="200" height="110" rx="12" fill="none" stroke="#FF6F00" stroke-dasharray="6 4"/><text x="880" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#FF6F00">Deleted</text><text x="880" y="114" text-anchor="middle" font-size="14" fill="#A4B0AE">TTL index</text>
  <path d="M155 155 C155 200, 880 200, 880 155" fill="none" stroke="#FF6F00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a3)"/><text x="520" y="222" text-anchor="middle" font-size="13" fill="#FF6F00">true cache: TTL straight from the cluster</text>
  </svg>`;
}

// LEGACY
add('legacy', 'The 4.4 estate', () => {
  const by = {}; allSvcs.filter(s => maj(s.ver) === '4.4').forEach(s => (by[s.proj.name] = by[s.proj.name] || []).push(s));
  const p44 = prodSvcs.filter(s => maj(s.ver) === '4.4');
  const dist = {}; prodSvcs.forEach(s => { const v = maj(s.ver); dist[v] = dist[v] || { n: 0, patch: 0 }; dist[v].n++; if (needsPatch(s.ver)) dist[v].patch++; });
  return `<div class="kicker">06 · The 4.4 estate</div><h2>The legacy clusters</h2>
  <p class="lead">${p44.length} prod and ${allSvcs.filter(s => maj(s.ver) === '4.4').length - p44.length} dev / preprod replica sets run 4.4, including payments, backend and both 8 TB caches. First we want to understand what makes them hard to move.</p>
  <div class="grid g3 block">${Object.entries(by).map(([pn, ss]) => `<div class="card"><h4>${pn}</h4><p class="sm">${ss.length} on 4.4${ss[0].prod ? '' : ' · non-prod'}</p><p>${ss.map(s => `<b>${s.svc}</b>${s.big ? ' <span class="pill p-amber">large</span>' : ''}`).join(', ')}</p></div>`).join('')}</div>
  <div class="grid g2 block">
    <div class="card"><span class="pill p-muted">With public tooling</span><h4 style="margin-top:10px">Upgrade first, then migrate</h4>
      <p>mongosync and Live Migration need 5.0 or later as the source, and Atlas runs 7.0 and later. A 4.4 dump restores only into 4.4.</p>
      <p class="sm">So: rolling upgrade 4.4 → 5.0.29+ on EC2, mongosync to Atlas 7.0, then a rolling upgrade to 8.0. Driver checks at every step.</p></div>
    <div class="card" style="border-color:var(--green)"><span class="pill p-green">With Migration Factory</span><h4 style="margin-top:10px">Migrate directly</h4>
      <p>MongoDB Professional Services tooling moves 4.4 straight to Atlas 8.0, with no upgrade chain on EC2.</p>
      <p class="sm">One driver check against 8.0 and one cutover per cluster. Details in the migration plan.</p></div>
  </div>
  <div class="block"><h3>The rest of the prod estate, by version</h3><div class="tw" style="margin-top:10px"><table><tr><th>Version</th><th>Prod clusters</th><th>Below the mongosync minimum</th><th>Path</th></tr>
  ${VERS.filter(v => dist[v]).map(v => `<tr><td><span class="vdot" style="background:${VC[v]}"></span><b>${v}</b></td><td>${dist[v].n}</td><td>${v === '4.4' ? 'not a source' : dist[v].patch + ' (min ' + MINP[v] + ')'}</td><td>${PATH[v]}</td></tr>`).join('')}</table></div></div>
  <div class="q"><b>Questions for the room</b>Which 4.4 services have an owner and a current driver? What blocks the move today: the upgrade, the drivers, or the size of the caches? Are any of them due to be retired or rebuilt?</div>
  ${src('mongosyncVer', 'mongosyncLim', 'live', 'dump')}`;
});

// DECISIONS
const DEC = ['Org model: one org per licence, COM and WL', 'Project list, including AffiliateComPreprod', 'Which services share a cluster, domain by domain', 'Which clusters stay dedicated', 'The approach for 4.4 and the two caches', 'Analytics nodes for reporting workloads'];
const OPEN = ['Real data and index sizes for the large clusters', 'CPU and memory usage: will you right-size on the way in?', 'Retention rules for caches, logs and history', 'Driver language and version per service', 'Whether COM and WL services may ever share a cluster'];
add('decisions', 'Decisions', () => `<div class="kicker">07 · Decisions</div><h2>What we agree today</h2>
  <p class="lead">Tick items off as we agree them in the room. Anything not decided becomes an open question with an owner.</p>
  <div class="grid g2 block"><div><h3>To decide</h3><div style="margin-top:8px">${DEC.map((d, i) => `<label class="ck" data-ck="d${i}"><input type="checkbox"><span>${d}</span></label>`).join('')}</div></div>
  <div><h3>Useful to learn</h3><div style="margin-top:8px">${OPEN.map((d, i) => `<label class="ck" data-ck="o${i}"><input type="checkbox"><span>${d}</span></label>`).join('')}</div></div></div>
  <div class="q"><b>Next steps</b>MongoDB updates this V1 with today’s decisions. The migration plan and the engagement model follow in the deck.</div>`);

// ---------------------------------------------------------------- router
S.splice(0, S.length, ...S.filter(s => s.id === 'target'));
const nav = document.getElementById('nav'), main = document.getElementById('main');
nav.innerHTML = S.length === 1 ? '<span style="color:var(--muted);font-size:14.5px;font-weight:700;white-space:nowrap">Target architecture · Warsaw, 25 Nov 2026</span>' : S.map((s, i) => `<a href="#${s.id}" data-id="${s.id}">${i ? `<span>0${i}</span>` : ''}${s.label}</a>`).join('');
let cur = null;
function show(id) {
  const i = Math.max(0, S.findIndex(s => s.id === id)); const s = S[i]; cur = i;
  const prev = S[i - 1], next = S[i + 1];
  main.innerHTML = `<section class="on" id="s-${s.id}">${s.html()}<div class="footnav">${prev ? `<a href="#${prev.id}">← ${prev.label}</a>` : '<span></span>'}${next ? `<a href="#${next.id}">${next.label} →</a>` : '<span></span>'}</div></section>`;
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === s.id));
  const a = nav.querySelector('a.on'); if (a) a.scrollIntoView({ block: 'nearest', inline: 'center' });
  if (s.id === 'target') { const q = document.getElementById('tq'); q.value = T.q; renderTarget(); }
  if (s.id === 'isolation') renderLevel();
  if (s.id === 'decisions') loadChecks();
  window.scrollTo(0, 0); closeDrawer();
}
function closeDrawer() { document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('rc-ws-' + k) || 'null'); localStorage.setItem('rc-ws-' + k, JSON.stringify(v)); } catch (e) { return null; } }
function loadChecks() { const st = store('checks') || {}; document.querySelectorAll('.ck').forEach(c => { const on = !!st[c.dataset.ck]; c.querySelector('input').checked = on; c.classList.toggle('done', on); }); }
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
  const acc = e.target.closest('.acc'); if (acc && !e.target.closest('table')) { acc.classList.toggle('open'); return; }
  const sb = e.target.closest('.seg button'); if (sb) { T[sb.parentElement.dataset.k] = sb.dataset.v; renderTarget(); return; }
  const ch = e.target.closest('.chip'); if (ch) { if (ch.dataset.today) openToday(ch.dataset.today); else if (ch.dataset.p) openCluster(ch.dataset.p, +ch.dataset.g); return; }
  const lb = e.target.closest('#ladder button'); if (lb) { LI = +lb.dataset.l; renderLevel(); return; }
  if (e.target.closest('#dx') || e.target.id === 'scrim') closeDrawer();
});
document.addEventListener('change', e => { const c = e.target.closest('.ck'); if (!c) return; const st = store('checks') || {}; st[c.dataset.ck] = e.target.checked; store('checks', st); c.classList.toggle('done', e.target.checked); });
document.addEventListener('input', e => { if (e.target.id === 'tq') { T.q = e.target.value.trim().toLowerCase(); renderTarget(); } });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') closeDrawer();
  if (e.key === 'ArrowRight' && cur < S.length - 1) location.hash = S[cur + 1].id;
  if (e.key === 'ArrowLeft' && cur > 0) location.hash = S[cur - 1].id;
});

show('target');
</script>
</body>
</html>
